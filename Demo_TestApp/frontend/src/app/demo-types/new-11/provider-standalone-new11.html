<div class="new11-shell">
  @if (new11Enabled) {
    <nav class="new11-menubar" aria-label="View">
      <button type="button" class="new11-menubar__item" [class.active]="view() === 'default'" (click)="view.set('default')">Default</button>
      <button type="button" class="new11-menubar__item" [class.active]="view() === 'new11'" (click)="view.set('new11')">New 11</button>
    </nav>
  }

  @if (new11Enabled && view() === 'new11') {
    <app-resource-11-browser [loginTypeLabel]="loginTypeLabel()" [callerId]="providerCallerId()" [practitionerIds]="practitionerIds" (logout)="logout.emit()"></app-resource-11-browser>
  } @else {
    <app-launch-standalone-provider [loginTypeLabel]="loginTypeLabel()" (logout)="logout.emit()"></app-launch-standalone-provider>
  }
</div>
