# Local, self-contained "run the whole product" stack — 5 containers, independent of the
# repo-root docker-compose.yml (which is a separate dev/E2E dependency stack: HAPI FHIR, RabbitMQ,
# output DBs, etc. — not touched by this file). Build the 3 custom images first:
#
#   ../scripts/build-images.sh            # or build-images.ps1 on Windows
#
# Then, from this folder:
#
#   cp .env.example .env   # edit secrets
#   docker compose up -d
#
# segue-app -> http://localhost:8080   demo-app -> http://localhost:5500
name: segue-containerized

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: segue-ctr-sqlserver
    labels:
      com.segue.project: "Segue"
      com.segue.component: "containerization"
      com.segue.environment: "local"
      com.segue.managed-by: "docker-compose"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
    ports:
      - "${SQL_HOST_PORT:-1434}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: segue-ctr-redis
    labels:
      com.segue.project: "Segue"
      com.segue.component: "containerization"
      com.segue.environment: "local"
      com.segue.managed-by: "docker-compose"
    # Relying solely on network isolation isn't defense-in-depth — requirepass means a compromised
    # container elsewhere on this network still can't just connect to Redis without the password.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  segue-app:
    build:
      context: ../../
      dockerfile: containerization/docker/segue-app/Dockerfile
      args:
        PORTAL_CONFIG: "${PORTAL_BUILD_CONFIG:-production}"
    image: segue-app:${IMAGE_TAG:-local}
    container_name: segue-ctr-app
    labels:
      com.segue.project: "Segue"
      com.segue.component: "containerization"
      com.segue.environment: "local"
      com.segue.managed-by: "docker-compose"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__FHIRBridgeDb: "Server=sqlserver,1433;Database=Segue;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Authentication__SigningKey: "${JWT_SIGNING_KEY}"
      DataProtection__KeyRingPath: "/app/keys"
      Portal__AllowedOrigins__0: "http://localhost:${DEMO_HOST_PORT:-5500}"
      AllowedHosts: "*"
      # Api and Gateway are sibling processes in one container (entrypoint.sh) - Api binds
      # loopback-only on 5000, and Gateway throws at startup outside Development without this.
      ApiBaseUrl: "http://127.0.0.1:5000/"
      # Swagger:Enabled defaults to false outside Development — turn it on for this containerized
      # stack so /swagger/** (proxied by the Gateway) actually has something to serve.
      Swagger__Enabled: "true"
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    volumes:
      - segue-dataprotection-keys:/app/keys
    # Fresh databases: segue-app and worker both auto-migrate FHIRBridgeDb on boot and can
    # race on the initial CREATE DATABASE (only the loser crashes; Migrate() is fine once the DB
    # exists). Auto-restart turns that into a self-healing retry instead of a wedged container.
    restart: unless-stopped

  demo-app:
    build:
      context: ../../
      dockerfile: containerization/docker/demo-app/Dockerfile
      args:
        DEMO_CONFIG: "${DEMO_BUILD_CONFIG:-production}"
    image: demo-app:${IMAGE_TAG:-local}
    container_name: segue-ctr-demo-app
    labels:
      com.segue.project: "Segue"
      com.segue.component: "containerization"
      com.segue.environment: "local"
      com.segue.managed-by: "docker-compose"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=HealthAppDb;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      AllowedFrontendOrigin: "http://localhost:${DEMO_HOST_PORT:-5500}"
    ports:
      - "${DEMO_HOST_PORT:-5500}:5500"
    restart: unless-stopped

  worker:
    build:
      context: ../../
      dockerfile: containerization/docker/worker/Dockerfile
    image: segue-worker:${IMAGE_TAG:-local}
    container_name: segue-ctr-worker
    labels:
      com.segue.project: "Segue"
      com.segue.component: "containerization"
      com.segue.environment: "local"
      com.segue.managed-by: "docker-compose"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not a guarantee (segue-app's own DB migration can still be in flight after it starts
      # listening), just a head start that makes the CREATE DATABASE race far less likely in
      # practice — `restart: unless-stopped` above/below is the actual safety net.
      segue-app:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__FHIRBridgeDb: "Server=sqlserver,1433;Database=Segue;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      RuntimeWorker__Enabled: "true"
      Messaging__Provider: "InMemory"
    restart: unless-stopped

volumes:
  sqlserver-data:
    labels:
      com.segue.project: "Segue"
      com.segue.component: "containerization"
      com.segue.environment: "local"
      com.segue.managed-by: "docker-compose"
  redis-data:
    labels:
      com.segue.project: "Segue"
      com.segue.component: "containerization"
      com.segue.environment: "local"
      com.segue.managed-by: "docker-compose"
  segue-dataprotection-keys:
    labels:
      com.segue.project: "Segue"
      com.segue.component: "containerization"
      com.segue.environment: "local"
      com.segue.managed-by: "docker-compose"
