name: Deploy

# Manual production deploy: click "Run workflow" on this workflow in the Actions tab (or
# `gh workflow run deploy.yml`). The build job runs on a GitHub-hosted runner and never touches
# the VM; the deploy job runs on a self-hosted runner installed on the VM itself (see
# deploy/windows/README.md), so no inbound network access to the VM is required.
#
# Matches the Kestrel-native / YARP Gateway architecture in Documents/Kestrel-Gateway-Deployment-Setup.html:
# FHIRBridge.Gateway is the only public-facing process (binds 80/443, proxies /api/** and /swagger/**
# to FHIRBridge.Api, serves the portal's static build directly). FHIRBridge.Api and FHIRBridge.Worker
# are internal-only. All three run as Windows Services.
#
# Also builds and deploys Demo_TestApp (a standalone third-party demo client) as its own Windows
# Service — it serves its own frontend directly (same-origin) but calls FHIRBridge's Gateway
# cross-origin, so its frontend bundle is built with that origin baked in (see vm_hostname input).
#
# Recommended hardening (one-time, in repo Settings > Environments): add required reviewers to the
# "production" environment so the deploy job pauses for an approval click before it runs.
on:
  workflow_dispatch:
    inputs:
      target:
        description: >
          production = the folders/services/ports you already deployed by hand (C:\inetpub\wwwroot\fhirbridge-*,
          ports 80/443/5000). test = a fully separate copy under C:\inetpub\wwwroot\test\fhirbridge-*, different
          service names, different ports — never touches the production deploy.
        type: choice
        required: true
        default: test
        options:
          - production
          - test
      vm_hostname:
        description: >
          VM's public hostname or IP (no scheme/port) — the Demo app's frontend calls FHIRBridge's Gateway
          directly, cross-origin, and that URL is compiled into its bundle at build time. production is built
          pointing at https://<this>; test is built pointing at https://<this>:9443. See deploy/windows/README.md.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Restore
        run: dotnet restore FHIRBridge.sln

      - name: Publish Api (win-x64, framework-dependent, loopback-only)
        run: >
          dotnet publish src/Api/FHIRBridge.Api/FHIRBridge.Api.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Api

      - name: Publish Gateway (win-x64, framework-dependent, public entry point)
        run: >
          dotnet publish src/Gateway/FHIRBridge.Gateway/FHIRBridge.Gateway.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Gateway

      - name: Publish Worker (win-x64, framework-dependent)
        run: >
          dotnet publish src/Worker/FHIRBridge.Worker/FHIRBridge.Worker.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Worker

      - name: Publish Demo backend (win-x64, framework-dependent)
        run: >
          dotnet publish Demo_TestApp/backend/HealthAppBackend.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/DemoBackend

      - name: Build portal
        working-directory: portal
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Stage portal build (served by the Gateway, not the Api)
        run: |
          mkdir -p publish/Portal
          cp -r portal/dist/fhirbridge-ui/browser/. publish/Portal/

      - name: Configure Demo app's FHIRBridge origin
        # The Demo frontend calls the Gateway cross-origin, and that URL is a compile-time constant
        # (see environment.prod.ts / environment.test.ts) — substitute the real origin in before building.
        working-directory: Demo_TestApp/frontend
        run: |
          if [ "${{ inputs.target }}" = "test" ]; then
            ORIGIN="https://${{ inputs.vm_hostname }}:9443"
            FILE="src/environments/environment.test.ts"
          else
            ORIGIN="https://${{ inputs.vm_hostname }}"
            FILE="src/environments/environment.prod.ts"
          fi
          sed -i "s#__FHIRBRIDGE_GATEWAY_ORIGIN__#$ORIGIN#" "$FILE"

      - name: Build Demo frontend
        working-directory: Demo_TestApp/frontend
        run: |
          npm ci
          npm run build -- --configuration ${{ inputs.target == 'test' && 'test' || 'production' }}

      - name: Stage Demo app (backend + its frontend, nested under the backend's portal/ folder)
        run: |
          mkdir -p publish/DemoBackend/portal
          cp -r Demo_TestApp/frontend/dist/frontend/browser/. publish/DemoBackend/portal/

      - name: Package deploy artifact
        run: |
          cd publish
          zip -r ../fhirbridge-deploy.zip Api Gateway Worker Portal DemoBackend

      - uses: actions/upload-artifact@v4
        with:
          name: fhirbridge-deploy
          path: fhirbridge-deploy.zip
          retention-days: 14

  deploy:
    name: deploy-to-vm
    needs: build
    runs-on: [self-hosted, Windows, fhirbridge-vm]
    # Selecting "test" above deploys under a "test" GitHub Environment (no approval gate unless you add
    # one) instead of "production" — keeps the two visibly separate in the Actions UI too.
    environment: ${{ inputs.target }}
    steps:
      # Needed for deploy/windows/Deploy-FHIRBridge.ps1 — not for the app binaries, those come from the artifact.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fhirbridge-deploy

      - name: Expand artifact
        shell: pwsh
        run: Expand-Archive -Path fhirbridge-deploy.zip -DestinationPath extracted -Force

      - name: Run deploy script (production — same paths/ports/services as the manual deploy)
        if: ${{ inputs.target == 'production' }}
        shell: pwsh
        run: |
          $artifactPath = (Resolve-Path extracted).Path
          ./deploy/windows/Deploy-FHIRBridge.ps1 -ArtifactPath $artifactPath

      - name: Run deploy script (test — separate folders, service names, and ports)
        if: ${{ inputs.target == 'test' }}
        shell: pwsh
        run: |
          $artifactPath = (Resolve-Path extracted).Path
          ./deploy/windows/Deploy-FHIRBridge.ps1 -ArtifactPath $artifactPath `
            -DeployRoot "C:\inetpub\wwwroot\test" `
            -ApiServiceName "FHIRBridge.Api.Test" `
            -GatewayServiceName "FHIRBridge.Gateway.Test" `
            -WorkerServiceName "FHIRBridge.Worker.Test" `
            -DemoServiceName "FHIRBridge.Demo.Test" `
            -ApiHealthCheckUrl "http://127.0.0.1:5100/health" `
            -GatewayHealthCheckUrl "http://localhost:9080/" `
            -DemoHealthCheckUrl "http://127.0.0.1:5600/"
