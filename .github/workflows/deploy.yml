name: Deploy

# Manual production deploy: click "Run workflow" on this workflow in the Actions tab (or
# `gh workflow run deploy.yml`). The build job runs on a GitHub-hosted runner and never touches
# the VM; the deploy job runs on a self-hosted runner installed on the VM itself (see
# deploy/windows/README.md), so no inbound network access to the VM is required.
#
# Matches the Kestrel-native / YARP Gateway architecture in Documents/Kestrel-Gateway-Deployment-Setup.html:
# FHIRBridge.Gateway is the only public-facing process (binds 80/443, proxies /api/** and /swagger/**
# to FHIRBridge.Api, serves the portal's static build directly). FHIRBridge.Api and FHIRBridge.Worker
# are internal-only. All three run as Windows Services.
#
# Recommended hardening (one-time, in repo Settings > Environments): add required reviewers to the
# "production" environment so the deploy job pauses for an approval click before it runs.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Restore
        run: dotnet restore FHIRBridge.sln

      - name: Publish Api (win-x64, framework-dependent, loopback-only)
        run: >
          dotnet publish src/Api/FHIRBridge.Api/FHIRBridge.Api.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Api

      - name: Publish Gateway (win-x64, framework-dependent, public entry point)
        run: >
          dotnet publish src/Gateway/FHIRBridge.Gateway/FHIRBridge.Gateway.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Gateway

      - name: Publish Worker (win-x64, framework-dependent)
        run: >
          dotnet publish src/Worker/FHIRBridge.Worker/FHIRBridge.Worker.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Worker

      - name: Build portal
        working-directory: portal
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Stage portal build (served by the Gateway, not the Api)
        run: |
          mkdir -p publish/Portal
          cp -r portal/dist/fhirbridge-ui/browser/. publish/Portal/

      - name: Package deploy artifact
        run: |
          cd publish
          zip -r ../fhirbridge-deploy.zip Api Gateway Worker Portal

      - uses: actions/upload-artifact@v4
        with:
          name: fhirbridge-deploy
          path: fhirbridge-deploy.zip
          retention-days: 14

  deploy:
    name: deploy-to-vm
    needs: build
    runs-on: [self-hosted, Windows, fhirbridge-vm]
    environment: production
    steps:
      # Needed for deploy/windows/Deploy-FHIRBridge.ps1 — not for the app binaries, those come from the artifact.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fhirbridge-deploy

      - name: Expand artifact
        shell: pwsh
        run: Expand-Archive -Path fhirbridge-deploy.zip -DestinationPath extracted -Force

      - name: Run deploy script
        shell: pwsh
        run: |
          $artifactPath = (Resolve-Path extracted).Path
          ./deploy/windows/Deploy-FHIRBridge.ps1 -ArtifactPath $artifactPath
