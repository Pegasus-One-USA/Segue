name: Deploy

# Two ways to trigger a production deploy:
#   1. Manual: click "Run workflow" on this workflow in the Actions tab (or
#      `gh workflow run deploy.yml`) — always allowed, any branch.
#   2. Automatic: push to one of the branches listed below whose HEAD commit message is the exact
#      literal string "Publish" (see the build job's `if:` — deliberately strict so ordinary commits
#      to that branch don't trigger a deploy). Edit the `branches:` list below to change which
#      branch(es) this applies to.
#
# The build job runs on a GitHub-hosted runner and never touches the VM; the deploy job runs on a
# self-hosted runner installed on the VM itself (see deploy/windows/README.md), so no inbound
# network access to the VM is required.
#
# Ships 6 artifacts: Api, Gateway, and Worker (Kestrel/background Windows Services), the Demo app
# backend (DemoApi, same pattern), and two static frontend builds (Portal, DemoPortal) consumed by
# Gateway and DemoApi respectively rather than IIS. See deploy/windows/README.md for the topology.
#
# Recommended hardening (one-time, in repo Settings > Environments): add required reviewers to the
# "production" environment so the deploy job pauses for an approval click before it runs.
on:
  push:
    # Configure which branch(es) can auto-deploy via a "Publish" commit here.
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build-publish
    runs-on: ubuntu-latest
    # Manual dispatch always runs; a push only runs the job (and therefore the deploy job, via
    # needs: below) when its HEAD commit message is exactly "Publish".
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            Demo_TestApp/frontend/package-lock.json

      - name: Restore
        run: dotnet restore FHIRBridge.sln

      - name: Publish Api (win-x64, framework-dependent)
        run: >
          dotnet publish src/Api/FHIRBridge.Api/FHIRBridge.Api.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Api

      - name: Publish Gateway (win-x64, framework-dependent)
        run: >
          dotnet publish src/Gateway/FHIRBridge.Gateway/FHIRBridge.Gateway.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Gateway

      - name: Publish Worker (win-x64, framework-dependent)
        run: >
          dotnet publish src/Worker/FHIRBridge.Worker/FHIRBridge.Worker.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/Worker

      - name: Publish Demo app backend (win-x64, framework-dependent)
        run: >
          dotnet publish Demo_TestApp/backend/HealthAppBackend.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/DemoApi

      - name: Build portal
        working-directory: portal
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Build Demo app frontend
        working-directory: Demo_TestApp/frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Stage static frontend builds
        run: |
          mkdir -p publish/Portal publish/DemoPortal
          cp -r portal/dist/fhirbridge-ui/browser/. publish/Portal/
          cp -r Demo_TestApp/frontend/dist/frontend/browser/. publish/DemoPortal/

      - name: Package deploy artifact
        run: |
          cd publish
          zip -r ../fhirbridge-deploy.zip Api Gateway Worker DemoApi Portal DemoPortal

      - uses: actions/upload-artifact@v4
        with:
          name: fhirbridge-deploy
          path: fhirbridge-deploy.zip
          retention-days: 14

  deploy:
    name: deploy-to-vm
    needs: build
    runs-on: [self-hosted, Windows, fhirbridge-vm]
    environment: production
    steps:
      # Needed for deploy/windows/Deploy-FHIRBridge.ps1 — not for the app binaries, those come from the artifact.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: fhirbridge-deploy

      - name: Expand artifact
        shell: powershell
        run: Expand-Archive -Path fhirbridge-deploy.zip -DestinationPath extracted -Force

      - name: Run deploy script
        shell: powershell
        run: |
          $artifactPath = (Resolve-Path extracted).Path
          ./deploy/windows/Deploy-FHIRBridge.ps1 -ArtifactPath $artifactPath
