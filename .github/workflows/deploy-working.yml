name: Deploy_Working

# Triggers:
#   1. Manual: Actions tab -> Deploy_Working -> Run workflow, on any branch. Always allowed, bypasses
#      the blank-commit check below (an explicit manual run is already a deliberate action).
#   2. Push to ANY branch (no branch filter below -- unlike Staging/QA/Dev, Working is intentionally
#      not restricted to one branch) whose HEAD commit message is the *exact* literal string
#      "Deploy", AND whose commit is blank (no file changes vs. its parent) -- see the `guard` job.
#      A commit with message "Deploy" that isn't blank is deliberately ignored, per policy. Typical
#      usage, from whichever branch you want to test:
#        git commit --allow-empty -m "Deploy"
#        git push origin <any-branch>
#
# No approval gate -- Working deploys immediately once the guard passes.
#
# The actual build+deploy work happens in the shared deploy-environment.yml reusable workflow --
# see deploy/windows/Deploy-FHIRBridge-Environment.ps1 for what gets deployed. Production's own
# deploy.yml / Deploy-FHIRBridge.ps1 are entirely separate and unaffected by this file.

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Guard (blank "Deploy" commit check)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Deploy'
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch -- proceeding regardless of commit content."
          elif git diff --quiet HEAD^ HEAD; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Commit message is 'Deploy' and the commit is blank -- proceeding."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Commit message is 'Deploy' but the commit is NOT blank -- ignoring, per policy."
          fi

  deploy:
    name: Build & deploy to Working
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: Working
    secrets: inherit
