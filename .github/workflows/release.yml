name: Release

# Cuts a customer-facing release. The TAG is the trigger, not a branch push: a branch moves, so it
# can never identify what a customer actually has, while a tag is permanent. Everything downstream
# derives its version from the tag name, so the number is typed exactly once — by whoever runs
# `git tag`.
#
#   git checkout release
#   git merge main_v2
#   git tag v1.1.0
#   git push origin release v1.1.0     <- this fires the workflow
#
# See docs/RELEASE.md for the full procedure and UPGRADE.md for what customers do with the result.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, WITHOUT the leading v (e.g. 1.1.0). Dry-run only — never pushes images.'
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC login to Azure — no stored Azure secret

# Images go to the vendor ACR (seguebuilds), with anonymous pull enabled so customer deployments
# need no registry credentials. Pushing needs an Entra app registration with AcrPush on that
# registry and a federated credential for this repo's `release` environment, whose variables are:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME (seguebuilds)
# and secrets:
#   REDIS_TLS_CRT, REDIS_TLS_KEY — the PEM contents of one long-lived redis.crt/redis.key pair
#   (see the Redis certificate step below for why it must not change between releases).
env:
  REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io

jobs:
  release:
    name: build-and-publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      # The tag is the single source of the version for this run. Strips the leading 'v' so the
      # number used everywhere else (image tags, assembly versions, VERSION) is bare: v1.1.0 -> 1.1.0.
      - name: Resolve version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version (expected 1.2.3 or 1.2.3-rc.1)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A pre-release (1.1.0-rc.1) is published but never marked as the latest release, so a
          # customer following "latest" is never handed a release candidate.
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $VERSION"

      # The tag and the committed VERSION file must agree. If they don't, the assemblies would be
      # stamped with one number while the images carry another — the exact confusion this whole
      # single-source setup exists to prevent. Fail loudly rather than publish a mismatched release.
      - name: Verify VERSION matches the tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::VERSION file says '$FILE_VERSION' but the tag says '${{ steps.version.outputs.version }}'. Update VERSION on the release branch, commit, then re-tag."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # FHIRBridge.Api.IntegrationTests needs ASPNETCORE_URLS and a live Postgres on 127.0.0.1:5432, neither
      # of which this job provisions — testing each project individually (rather than the whole .sln) keeps
      # that gap from failing every release for a reason unrelated to the code being released.
      - name: Build and test
        run: |
          dotnet restore FHIRBridge.sln
          dotnet build FHIRBridge.sln --configuration Release --no-restore \
            -p:SourceRevisionId=${{ github.sha }}
          dotnet test tests/FHIRBridge.UnitTests --configuration Release --no-build --verbosity normal
          dotnet test tests/FHIRBridge.Runtime.UnitTests --configuration Release --no-build --verbosity normal
          dotnet test tests/FHIRBridge.ArchitectureTests --configuration Release --no-build --verbosity normal

      - name: Log in to Azure
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to registry
        if: github.event_name == 'push'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      # A published version is immutable (see the push step below) — refuse to overwrite one rather
      # than silently re-point a tag that customer deployments already reference.
      - name: Refuse to overwrite a published version
        if: github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for image in segue-app segue-worker segue-redis segue-postgres segue-postgres-backup; do
            # A never-pushed-to repository errors with "not found" — that just means no tags yet.
            if az acr repository show-tags --name "${{ vars.ACR_NAME }}" --repository "$image" \
                 --query "[?@=='$VERSION']" -o tsv --only-show-errors 2>/dev/null | grep -qx "$VERSION"; then
              echo "::error::$image:$VERSION is already published. Ship the fix as the next version instead."
              exit 1
            fi
          done

      # redis.crt/redis.key are gitignored (never commit a private key), so segue-redis's Dockerfile
      # has nothing to COPY on a fresh checkout. A release restores the ONE long-lived pair from
      # secrets: every deployment trusts the cert by thumbprint (redisTrustedCertificateThumbprint),
      # so a new pair per release would make an upgraded app refuse its own Redis. A dry run has no
      # secrets to rely on and pushes nothing, so it builds with a throwaway pair instead.
      - name: Restore the redis-tls certificate
        id: redis-cert
        env:
          REDIS_TLS_CRT: ${{ secrets.REDIS_TLS_CRT }}
          REDIS_TLS_KEY: ${{ secrets.REDIS_TLS_KEY }}
        run: |
          CERT_DIR=containerization/docker/redis-tls
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -z "$REDIS_TLS_CRT" ] || [ -z "$REDIS_TLS_KEY" ]; then
              echo "::error::REDIS_TLS_CRT / REDIS_TLS_KEY are not set on the release environment."
              exit 1
            fi
            printf '%s\n' "$REDIS_TLS_CRT" > "$CERT_DIR/redis.crt"
            printf '%s\n' "$REDIS_TLS_KEY" > "$CERT_DIR/redis.key"
            chmod 600 "$CERT_DIR/redis.key"
          else
            chmod +x "$CERT_DIR/generate-cert.sh"
            "$CERT_DIR/generate-cert.sh"
          fi
          THUMBPRINT="$(openssl x509 -in "$CERT_DIR/redis.crt" -noout -fingerprint -sha1 | sed -E 's/^.*=//; s/://g')"
          echo "thumbprint=$THUMBPRINT" >> "$GITHUB_OUTPUT"

      # Images are tagged with the exact version and pushed. The tag is immutable by convention:
      # a published version is never rebuilt or overwritten — if it is wrong, the fix ships as the
      # next number. Older tags are never deleted either; a customer who has not upgraded yet still
      # needs the image their deployment references.
      - name: Build and push images
        if: github.event_name == 'push'
        run: |
          chmod +x containerization/scripts/build-images.sh
          ./containerization/scripts/build-images.sh \
            -r "${REGISTRY}" \
            -t "${{ steps.version.outputs.version }}" \
            -p

      - name: Build images (dry run, no push)
        if: github.event_name == 'workflow_dispatch'
        run: |
          chmod +x containerization/scripts/build-images.sh
          ./containerization/scripts/build-images.sh -t "${{ steps.version.outputs.version }}"

      # The published ARM template must name its own build, so a customer deploying it gets exactly
      # this release rather than whatever is newest. Rewritten here (not committed pinned) so the
      # repo's own default stays whatever the release branch last shipped.
      - name: Pin deploy template to this version
        if: github.event_name == 'push'
        run: |
          sed -i "s/^param imageTag string = '.*'$/param imageTag string = '${{ steps.version.outputs.version }}'/" \
            containerization/azure-deploy/main.bicep
          grep -n "param imageTag" containerization/azure-deploy/main.bicep

      - name: Compile ARM template
        if: github.event_name == 'push'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az bicep build --file containerization/azure-deploy/main.bicep \
              --outfile containerization/azure-deploy/main.json

      - name: Upload deploy artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts-${{ steps.version.outputs.version }}
          path: |
            containerization/azure-deploy/main.json
            containerization/azure-deploy/createUiDefinition.json
            containerization/azure-deploy/main.bicep

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            containerization/azure-deploy/main.json
            containerization/azure-deploy/createUiDefinition.json
          body: |
            ## Segue v${{ steps.version.outputs.version }}

            **Images** (tag `${{ steps.version.outputs.version }}`):
            `segue-app` · `segue-worker` · `segue-redis` · `segue-postgres` · `segue-postgres-backup`

            Published to `${{ env.REGISTRY }}`, built from commit ${{ github.sha }}.

            **Redis TLS certificate thumbprint** (`redisTrustedCertificateThumbprint`, containerized Redis only):
            `${{ steps.redis-cert.outputs.thumbprint }}`

            Upgrading an existing deployment: see [UPGRADE.md](../blob/v${{ steps.version.outputs.version }}/docs/UPGRADE.md).
            **Back up the database before upgrading** — migrations run automatically on startup.
