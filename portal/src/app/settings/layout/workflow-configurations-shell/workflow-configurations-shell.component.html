<div class="shell-tabs-header">
  <h1 class="shell-tabs-title">Workflow Configurations</h1>
  <p class="shell-tabs-sub">Source and destination connections, mapping profiles, and transformation rules</p>
</div>

<nav class="shell-tabs">
  @for (section of sections(); track section.route) {
    <a class="shell-tab" [routerLink]="section.route" routerLinkActive="active">
      <mat-icon>{{ section.icon }}</mat-icon>
      {{ section.label }}
    </a>
  }
</nav>

<router-outlet />
