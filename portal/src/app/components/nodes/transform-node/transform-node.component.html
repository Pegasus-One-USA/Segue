<span class="port port-in"></span>
<span class="port port-out" (pointerdown)="onPortPointerDown($event)"></span>

@if (!isDestination()) {
  <button
    class="sn-add-btn"
    (click)="onAddNextClick($event)"
    (pointerdown)="$event.stopPropagation()"
    title="Add next module"
  >
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
}

<div
  class="sn-circle"
  [style.background]="nodeColor()"
  [style.--node-color]="nodeColor()"
  (pointerdown)="onCirclePointerDown($event)"
  (pointermove)="onCirclePointerMove($event)"
  (pointerup)="onCirclePointerUp($event)"
  (pointercancel)="onCirclePointerUp($event)"
>
  <span class="sn-abbr">{{ abbr() }}</span>
</div>

<div class="sn-labels">
  <strong class="sn-name">{{ transformName() }}</strong>
  <span class="sn-context">from {{ sourceName() }}</span>
  <span class="sn-type-tag" [style.color]="typeTagColor()" [style.background]="typeTagBg()">{{ typeTag() }}</span>
  @if (isCaveat()) {
    <span class="sn-caveat-tag">⚠ caveat</span>
  }
</div>
