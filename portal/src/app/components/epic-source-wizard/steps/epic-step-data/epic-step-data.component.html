<!-- ═══════════════════════ CARD: Launch Context ════════════════════════════ -->
<div class="wiz-card">
  <div class="wiz-card-head">
    <h3>Launch Context</h3>
    <span class="wiz-tag">EHR-initiated</span>
  </div>
  <div class="wiz-card-body" [formGroup]="form">
    <div class="form-grid">

      <!-- Advanced fields -->
      @if (showAdvanced()) {
        <div class="form-field full">
          <label>Trusted iss Allow-List</label>
          <textarea formControlName="trustedIss" rows="2"></textarea>
          <span class="help-text">One URL per line. Requests from other issuers are rejected.</span>
        </div>

        <div class="form-field">
          <label>Issuer iss <span class="tag-fixed">fixed</span></label>
          <input type="text" readonly value="Required" />
        </div>

        <div class="form-field">
          <label>Launch Token <span class="tag-fixed">fixed</span></label>
          <input type="text" readonly value="Required" />
        </div>

        <div class="form-field">
          <label>Clinician fhirUser</label>
          <select formControlName="clinicianRequired">
            <option value="required">Required</option>
            <option value="optional">Optional</option>
          </select>
        </div>

        <div class="form-field">
          <label>id_token validation</label>
          <select formControlName="idTokenValidation">
            <option value="full">Validate sig + iss + aud + exp + nonce</option>
            <option value="none">None</option>
          </select>
        </div>

        <div class="form-field full">
          <label>fhirUser Practitioner resolution</label>
          <select formControlName="fhirUserResolution">
            <option value="resolve">Resolve to Practitioner/PractitionerRole</option>
            <option value="store-ref">Store reference only</option>
            <option value="none">Do not resolve</option>
          </select>
        </div>
      }

      <!-- Patient Context (always) -->
      <div class="form-field">
        <label>Patient Context</label>
        <select formControlName="patientContext">
          <option value="required">Required</option>
          <option value="optional">Optional</option>
          <option value="ignore">Ignore</option>
        </select>
      </div>

      <!-- Advanced context fields -->
      @if (showAdvanced()) {
        <div class="form-field">
          <label>Encounter Context</label>
          <select formControlName="encounterContext">
            <option value="optional">Optional</option>
            <option value="required">Required</option>
            <option value="ignore">Ignore</option>
          </select>
        </div>

        <div class="form-field">
          <label>Location / Department</label>
          <select formControlName="locationContext">
            <option value="optional">Optional</option>
            <option value="required">Required</option>
            <option value="ignore">Ignore</option>
          </select>
        </div>

        <div class="form-field">
          <label>Appointment</label>
          <select formControlName="appointmentContext">
            <option value="optional">Optional</option>
            <option value="required">Required</option>
            <option value="ignore">Ignore</option>
          </select>
        </div>

        <div class="form-field">
          <label>fhirContext SMART v2</label>
          <select formControlName="fhirContext">
            <option value="accept">Accept &amp; route</option>
            <option value="ignore">Ignore</option>
          </select>
        </div>

        <div class="form-field">
          <label>need_patient_banner</label>
          <select formControlName="needPatientBanner">
            <option value="honor">Honor Epic value</option>
            <option value="always-own">Always show own banner</option>
          </select>
        </div>

        <div class="form-field">
          <label>smart_style_url</label>
          <select formControlName="smartStyle">
            <option value="apply">Apply Epic styling</option>
            <option value="default">Segue default</option>
          </select>
        </div>

        <div class="form-field">
          <label>tenant / organization + intent</label>
          <select formControlName="tenantIntent">
            <option value="capture">Capture &amp; route</option>
            <option value="ignore">Ignore</option>
          </select>
        </div>

        <div class="form-field">
          <label>Frame / Embedding Policy</label>
          <select formControlName="framePolicy">
            <option value="allow-epic">Allow Epic frame</option>
            <option value="same-origin">Same-origin only</option>
            <option value="deny">Deny framing</option>
          </select>
        </div>
      }
    </div>
  </div>
</div>

<!-- ═══════════════════════ CARD: SMART Scopes ══════════════════════════════ -->
<div class="wiz-card">
  <div class="wiz-card-head">
    <h3>SMART Scopes</h3>
    <span class="wiz-tag">{{ wiz.resources().length }} resources</span>
  </div>
  <div class="wiz-card-body" [formGroup]="form">
    <div class="form-grid">

      @if (showAdvanced()) {
        <!-- Scope Version field hidden from the wizard; scopeVersion control stays in the form
             (default 'v2', still auto-detected/submitted) — see epic-step-data.component.ts. -->
        <div class="form-field">
          <label>Base / Launch Scopes</label>
          <input type="text" formControlName="baseScopes" />
        </div>
      }

      <!-- FHIR Resources checkboxes (always) -->
      <div class="form-field full">
        <label>
          FHIR Resources
          @if (resourcesAreAuto) {
            <span class="tag-auto">auto-detected from /metadata</span>
          }
        </label>
        <div class="resource-grid">
          @for (r of allResources; track r) {
            <label class="resource-item">
              <input
                type="checkbox"
                [checked]="isResourceChecked(r)"
                (change)="toggleRes(r, $event)"
              />
              {{ r }}
            </label>
          }
        </div>
      </div>

      <!-- Generated Scope Request (always) -->
      <div class="form-field full">
        <label>Generated Scope Request <span class="tag-auto">computed</span></label>
        <div class="code-box">{{ wiz.scopeString() }}</div>
      </div>
    </div>
  </div>
</div>
