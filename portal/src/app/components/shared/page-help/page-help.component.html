<button
  #trigger
  type="button"
  class="help-trigger"
  [attr.aria-label]="heading()"
  [attr.aria-expanded]="open()"
  [title]="heading()"
  (click)="show()"
>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
    <path d="M12 11v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="12" cy="7.75" r="1.1" fill="currentColor"/>
  </svg>
</button>

@if (open()) {
  <!-- A real button (not a clickable div) so the click target is a native control; kept out of the tab order
       because the Close button and Escape already cover keyboard users. -->
  <button type="button" class="help-backdrop" tabindex="-1" aria-label="Close help" [class.is-closing]="closing()"
          (click)="hide()"></button>
  <aside class="help-drawer" [class.is-closing]="closing()" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId">
    <header class="help-drawer-head">
      <h2 class="help-drawer-title" [id]="titleId">{{ heading() }}</h2>
      <button #closeButton type="button" class="help-drawer-close" aria-label="Close help" (click)="hide()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <!-- .info-panel gives the projected content the shared explainer styles; the drawer drops the panel's border. -->
    <div class="help-drawer-body info-panel">
      <ng-content />
    </div>
  </aside>
}
