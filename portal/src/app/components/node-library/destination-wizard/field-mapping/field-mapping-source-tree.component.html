<div class="fm-source-card" [style.left.px]="x()" [style.top.px]="y()">
  <div
    class="fm-source-head"
    (pointerdown)="onHeadPointerDown($event)"
    (pointermove)="onHeadPointerMove($event)"
    (pointerup)="onHeadPointerUp($event)"
  >
    <span class="fm-source-kind">payload</span>
    <span class="fm-source-name">
      {{ forest()[0]?.label ?? 'payload' }}{{ forest().length > 1 ? ' + ' + (forest().length - 1) : '' }}
    </span>
  </div>
  <div class="fm-source-rows">
    @for (root of forest(); track root.id; let i = $index) {
      <div class="fm-source-group" [style.--fm-group-color]="groupColorVar(i)">
        <app-field-mapping-tree-node
          [node]="root"
          [depth]="0"
          [isCollapsed]="isCollapsed()"
          [isMapped]="isMapped()"
          [isArmed]="isArmed()"
          (toggleCollapse)="toggleCollapse.emit($event)"
          (armToggle)="armToggle.emit($event)"
          (dragStart)="dragStart.emit($event)"
          (dragMove)="dragMove.emit($event)"
          (dragEnd)="dragEnd.emit($event)"
        />
      </div>
    }
  </div>
</div>
