<div
  class="fm-createtable-backdrop"
  tabindex="0"
  role="dialog"
  aria-modal="true"
  aria-labelledby="fm-createtable-title"
  (click)="onBackdropClick($event)"
  (keydown.escape)="onEscape()"
>
  <div class="fm-createtable-dialog">
    <h3 class="fm-createtable-title" id="fm-createtable-title">Create a new destination table</h3>

    <label class="fm-createtable-field">
      <span class="text-label">Table name<span class="req">*</span></span>
      <input
        #nameInput
        class="fm-createtable-input"
        [value]="tableName()"
        (input)="onTableNameInput($any($event.target).value)"
        placeholder="e.g. PatientAllergy"
        [disabled]="submitting()"
      />
    </label>

    <div class="fm-createtable-field">
      <span class="text-label">Does this table relate to a table already on the canvas?</span>
      <div class="fm-createtable-relation-options">
        <label class="fm-createtable-radio">
          <input
            type="radio" name="fm-createtable-relation" value="standalone"
            [checked]="relation() === 'standalone'"
            [disabled]="submitting()"
            (change)="onRelationChange('standalone')"
          />
          <span>No — standalone table</span>
        </label>
        <label class="fm-createtable-radio">
          <input
            type="radio" name="fm-createtable-relation" value="child"
            [checked]="relation() === 'child'"
            [disabled]="submitting() || existingTables().length === 0"
            (change)="onRelationChange('child')"
          />
          <span>Yes — child of another table</span>
        </label>
      </div>
    </div>

    @if (relation() === 'child') {
      <div class="fm-createtable-relation-block">
        <label class="fm-createtable-field">
          <span class="text-label">Parent table</span>
          <select
            class="fm-createtable-select"
            [value]="parentTable()"
            (change)="setParentTable($any($event.target).value)"
            [disabled]="submitting()"
          >
            @for (t of existingTables(); track t) { <option [value]="t">{{ t }}</option> }
          </select>
        </label>
        <label class="fm-createtable-field">
          <span class="text-label">Relation column (parent)</span>
          <select
            class="fm-createtable-select"
            [value]="parentColumn()"
            (change)="onParentColumnChange($any($event.target).value)"
            [disabled]="submitting()"
          >
            @for (c of parentColumnOptions(); track c) { <option [value]="c">{{ c }}</option> }
          </select>
        </label>
        <label class="fm-createtable-field">
          <span class="text-label">New FK column name</span>
          <input
            class="fm-createtable-input"
            [value]="fkColumnName()"
            (input)="onFkColumnNameInput($any($event.target).value)"
            [disabled]="submitting()"
          />
        </label>
      </div>
    }

    <div class="fm-createtable-columns-head">
      <span class="text-label">Columns</span>
      <button type="button" class="fm-createtable-addcol-btn" [disabled]="submitting()" (click)="addColumn()">+ Add column</button>
    </div>

    <div class="fm-createtable-columns">
      <div class="fm-createtable-col-row fm-createtable-col-row--fixed">
        <span class="fm-createtable-col-name">Id</span>
        <span class="fm-createtable-col-type">bigint</span>
        <span class="fm-createtable-col-pk">PK</span>
      </div>
      @for (c of columns(); track $index; let i = $index) {
        <div class="fm-createtable-col-row">
          <input
            class="fm-createtable-col-input"
            [value]="c.name"
            (input)="onColumnNameInput(i, $any($event.target).value)"
            placeholder="Column name"
            [disabled]="submitting()"
          />
          <select
            class="fm-createtable-col-select"
            [value]="c.dataType"
            (change)="onColumnTypeChange(i, $any($event.target).value)"
            [disabled]="submitting()"
          >
            @for (t of dataTypes; track t) { <option [value]="t">{{ t }}</option> }
          </select>
          <button
            type="button"
            class="fm-createtable-col-remove"
            aria-label="Remove column"
            [disabled]="submitting()"
            (click)="removeColumn(i)"
          >✕</button>
        </div>
      }
    </div>

    @if (error()) {
      <p class="fm-createtable-error">{{ error() }}</p>
    }

    <div class="fm-createtable-actions">
      <button type="button" class="btn btn-secondary" [disabled]="submitting()" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="btn btn-primary" [disabled]="!canSubmit()" (click)="submit()">
        {{ submitting() ? 'Creating…' : 'Create table' }}
      </button>
    </div>
  </div>
</div>
