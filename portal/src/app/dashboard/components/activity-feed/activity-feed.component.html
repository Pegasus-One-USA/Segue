<div class="panel">
  <div class="panel-header">
    <h2 class="panel-title">Activity Feed</h2>
    <a class="panel-link">View all →</a>
  </div>

  <div class="feed-list">
    @for (event of events(); track event.id) {
      <div class="feed-row" [class]="'feed-' + event.severity">
        <span class="feed-icon-wrap" [class]="'icon-' + event.severity">
          <span class="feed-icon">{{ icon(event.severity) }}</span>
        </span>
        <div class="feed-body">
          <span class="feed-msg">{{ event.message }}</span>
          <span class="feed-time">{{ event.timestamp | date:'MMM d, h:mm a' }}</span>
        </div>
      </div>
    }
    @empty {
      <div class="feed-empty muted">No recent activity.</div>
    }
  </div>
</div>
