<div class="panel">
  <div class="panel-header">
    <h2 class="panel-title">Recent Workflows</h2>
    <a class="panel-link" routerLink="/execution-history">View all →</a>
  </div>

  <div class="table-wrap">
    <table class="ptable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Source</th>
          <th>Status</th>
          <th>Last Run</th>
        </tr>
      </thead>
      <tbody>
        @for (run of runs(); track run.id) {
          <tr class="ptable-row">
            <td class="name-cell">{{ run.pipelineName }}</td>
            <td class="muted">{{ sourceLabel(run) }}</td>
            <td>
              <span class="status-badge" [class]="'status-' + statusClass(run.status)">
                {{ statusLabel(run.status) }}
              </span>
            </td>
            <td class="muted">{{ run.startedAt | date:'MMM d, h:mm a' }}</td>
          </tr>
        }
        @empty {
          <tr>
            <td colspan="4" class="empty-cell muted">No workflow runs found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
