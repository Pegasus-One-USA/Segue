<div class="panel">
  <div class="panel-header">
    <h2 class="panel-title">Execution Status</h2>
    <span class="phase-badge">Phase 2</span>
  </div>

  <div class="donut-wrap">
    <svg viewBox="0 0 100 100" class="donut-svg">
      <g transform="rotate(-90 50 50)">
        <!-- track -->
        <circle cx="50" cy="50" r="44" fill="none" stroke="#1e2130" stroke-width="10" />
        <!-- segments -->
        @for (seg of segments(); track seg.status) {
          @if (seg.count > 0) {
            <circle
              cx="50" cy="50" r="44"
              fill="none"
              [attr.stroke]="seg.color"
              stroke-width="10"
              stroke-linecap="butt"
              [attr.stroke-dasharray]="seg.dasharray"
              [attr.stroke-dashoffset]="seg.dashoffset"
            />
          }
        }
      </g>
    </svg>
    <div class="donut-center">
      <div class="donut-total">{{ total() }}</div>
      <div class="donut-sub">total runs</div>
    </div>
  </div>

  <div class="seg-list">
    @for (seg of segments(); track seg.status) {
      <div class="seg-row">
        <span class="seg-dot" [style.background]="seg.color"></span>
        <span class="seg-label">{{ seg.label }}</span>
        <span class="seg-count">{{ seg.count }}</span>
        <span class="seg-pct muted">{{ seg.pct }}%</span>
      </div>
    }
  </div>
</div>
