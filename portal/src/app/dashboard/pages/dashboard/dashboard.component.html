<div class="dash-shell">

  <!-- Sidebar -->
  <app-sidebar [collapsed]="sidebarCollapsed()" />

  <!-- Main -->
  <div class="dash-main">

    <!-- Topbar -->
    <header class="dash-topbar">
      <button class="collapse-btn" type="button" (click)="toggleSidebar()" title="Toggle sidebar">
        &#9776;
      </button>

      <div class="dash-breadcrumb">
        <span class="breadcrumb-page">Dashboard</span>
      </div>

      <div class="topbar-right">
        <span class="refresh-hint">Updated {{ lastRefreshed() | date:'h:mm a' }}</span>
        <button class="refresh-btn" type="button" (click)="refresh()">&#8635; Refresh</button>
        <div class="notif-btn" title="Notifications">
          <span>&#128276;</span>
          <span class="notif-badge">3</span>
        </div>
        <app-user-menu />
      </div>
    </header>

    <!-- Scrollable content -->
    <div class="dash-content">

      <!-- Page header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Overview</h1>
          <p class="page-sub">FHIR pipeline health, execution status, and system metrics</p>
        </div>
        <a class="new-pipeline-btn" routerLink="/workflow-builder">+ New Pipeline</a>
      </div>

      <!-- KPI Row -->
      <div class="kpi-row">
        @for (metric of kpis(); track metric.id) {
          <app-kpi-card [metric]="metric" />
        }
      </div>

      <!-- Middle Row: Pipelines + Execution -->
      <div class="grid-2col wide-left">
        <app-pipeline-table
          [runs]="runs()"
          (runClicked)="onActionClick($event)"
          (editClicked)="onActionClick($event)"
          (logsClicked)="onActionClick($event)"
        />
        <app-execution-status [runs]="runs()" />
      </div>

      <!-- Bottom Row: Health + Actions -->
      <div class="grid-2col">
        <app-system-health [checks]="health()" />
        <app-quick-actions (actionClick)="onActionClick($event)" />
      </div>

      <!-- Activity Feed -->
      <app-activity-feed [events]="activity()" />

    </div>
  </div>
</div>
