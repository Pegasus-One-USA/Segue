<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-logo">
    <span class="logo-hex">&#11041;</span>
    @if (!collapsed()) {
      <span class="logo-text">FHIRBridge</span>
    }
  </div>

  <nav class="sidebar-nav">
    @for (entry of navEntries; track $index) {
      @if (isSection(entry)) {
        @if (!collapsed()) {
          <div class="nav-section">{{ entry.label }}</div>
        } @else {
          <div class="nav-divider"></div>
        }
      } @else if (isItem(entry)) {
        <a
          class="nav-item"
          [routerLink]="entry.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: entry.exact ?? false }"
          [title]="collapsed() ? entry.label : ''"
        >
          <span class="nav-icon">{{ entry.icon }}</span>
          @if (!collapsed()) {
            <span class="nav-label">{{ entry.label }}</span>
          }
        </a>
      }
    }
  </nav>
</aside>
