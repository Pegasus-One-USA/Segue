<app-auth-card>

  @if (sent()) {

    <h1 class="auth-title">Check your inbox</h1>
    <div class="auth-success">
      <p>A password reset link has been sent to <b>{{ email }}</b>.</p>
      <p class="hint">Didn't receive it? Check spam or try again.</p>
      <a routerLink="/auth/login">Back to sign in</a>
    </div>

  } @else {

    <h1 class="auth-title">Forgot password</h1>
    <p class="auth-sub">Enter your email and we'll send a reset link.</p>

    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }

    <form class="auth-form" (ngSubmit)="submit()">

      <div class="auth-field">
        <label for="fp-email">Email</label>
        <input
          id="fp-email"
          type="email"
          autocomplete="email"
          placeholder="you@org.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading()">
        @if (loading()) { Sending… } @else { Send reset link }
      </button>

      <div class="auth-links center">
        <a routerLink="/auth/login">Back to sign in</a>
      </div>

    </form>

  }

</app-auth-card>
