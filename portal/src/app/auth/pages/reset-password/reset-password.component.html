<app-auth-card>

  @if (done()) {

    <h1 class="auth-title">Password reset</h1>
    <div class="auth-success">
      <p>Your password has been updated successfully.</p>
      <a routerLink="/auth/login">Sign in with your new password</a>
    </div>

  } @else {

    <h1 class="auth-title">Reset password</h1>
    <p class="auth-sub">Choose a strong new password for your account.</p>

    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }

    <form class="auth-form" (ngSubmit)="submit()">

      <div class="auth-field">
        <label for="rp-new">New password</label>
        <input
          id="rp-new"
          type="password"
          autocomplete="new-password"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
        />
        <app-password-strength [password]="newPassword" />
      </div>

      <div class="auth-field">
        <label for="rp-confirm">Confirm password</label>
        <input
          id="rp-confirm"
          type="password"
          autocomplete="new-password"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          [class.error]="mismatch()"
          required
        />
        @if (mismatch()) {
          <span class="field-err">Passwords do not match.</span>
        }
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading() || mismatch()">
        @if (loading()) { Resetting… } @else { Reset password }
      </button>

    </form>

  }

</app-auth-card>
