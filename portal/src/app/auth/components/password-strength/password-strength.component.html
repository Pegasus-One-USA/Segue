<!-- auth/components/password-strength/password-strength.component.html -->
@if (password().length > 0) {
  <div class="ps-wrapper">
    <!-- Strength bar segments -->
    <div class="ps-bars">
      @for (filled of bars(); track $index) {
        <div class="ps-bar" [class]="levelClass()" [class.filled]="filled"></div>
      }
    </div>

    <!-- Label row -->
    <div class="ps-meta">
      <span class="ps-label" [class]="levelClass()">{{ strengthLabel() }}</span>
    </div>

    <!-- Rule checklist -->
    <ul class="ps-rules">
      @for (rule of rules(); track rule.label) {
        <li class="ps-rule" [class.met]="rule.met">
          <span class="ps-rule-icon">{{ rule.met ? '✓' : '✗' }}</span>
          <span class="ps-rule-text">{{ rule.label }}</span>
        </li>
      }
    </ul>
  </div>
}
