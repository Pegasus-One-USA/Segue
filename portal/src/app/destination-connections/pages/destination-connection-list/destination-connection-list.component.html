<div class="list-page">

  <app-connection-list-toolbar
    testIdPrefix="dest"
    placeholder="Search by name, type or address…"
    [search]="search()"
    [canCreate]="canCreate()"
    (searchChange)="onSearch($event)"
    (resetClicked)="reset()"
    (createClicked)="pickerOpen.set(true)">
    <app-destination-connection-filters
      [value]="filters()"
      [rowTypes]="rowTypes()"
      [showDestinations]="canListDestinations()"
      [showWrite]="canListWrite()"
      (valueChange)="onFilters($event)" />
  </app-connection-list-toolbar>

  <div class="table-card">
    @if (loading()) {
      <!-- The global loader already shows this page is busy — no local spinner here. -->
    } @else {
      <app-connection-list-table
        testIdPrefix="dest"
        [rows]="result().items"
        [total]="result().total"
        [columns]="columns"
        [sort]="sort()"
        [actionsFor]="actionsFor"
        [statusLabels]="statusLabels"
        [emptyTitle]="isFiltered() ? 'No connections matched your search' : 'No destination connections yet'"
        [emptyHint]="isFiltered() ? 'Try adjusting your search or filter.' : 'Get started by adding your first connection.'"
        (sortChange)="onSort($event)"
        (action)="onAction($event)" />

      @if (result().total > 0) {
        <app-pagination-bar
          [pageIndex]="result().pageIndex"
          [pageSize]="pageSize()"
          [totalCount]="result().total"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (pageChange)="onPage($event)"
        />
      }
    }
  </div>

  @if (pickerOpen()) {
    <app-connection-kind-picker
      testIdPrefix="dest"
      title="New destination connection"
      subtitle="Choose where this connection writes to."
      [groups]="pickerGroups()"
      (picked)="onPicked($event)"
      (closed)="pickerOpen.set(false)" />
  }

  <!-- Each kind owns its rows, actions and forms. Never inside an @if: the page loads them right after the view is
       built. -->
  <app-destination-configuration-kind (changed)="reload('destination')" />
  <app-ehr-write-connection-kind (changed)="reload('ehr-write')" />

</div>
