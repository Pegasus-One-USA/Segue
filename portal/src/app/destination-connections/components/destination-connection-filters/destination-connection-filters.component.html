<div class="type-filter-wrap">
  <select class="type-filter-select" data-testid="dest-filter-type" aria-label="Type" [value]="value().type" (change)="onType($any($event.target).value)">
    <option value="">All types</option>
    @if (showDestinations() && showWrite()) {
      <option value="kind:destination" [selected]="value().type === 'kind:destination'">All destinations</option>
      <option value="kind:ehr-write" [selected]="value().type === 'kind:ehr-write'">All EHR write connections</option>
    }
    @for (g of typeGroups(); track g.label) {
      <optgroup [label]="g.label">
        @for (o of g.options; track o.value) {
          <option [value]="o.value" [selected]="o.value === value().type">{{ o.label }}</option>
        }
      </optgroup>
    }
  </select>
</div>

<div class="type-filter-wrap">
  <select class="type-filter-select" data-testid="dest-filter-status" aria-label="Status" [value]="value().status" (change)="onStatus($any($event.target).value)">
    <option value="">All statuses</option>
    <option value="true">Enabled</option>
    <option value="false">Disabled</option>
  </select>
</div>
