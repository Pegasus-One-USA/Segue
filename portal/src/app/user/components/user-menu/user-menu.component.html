<div class="um-wrap" [class.open]="menuOpen()">

  <!-- ── Trigger ─────────────────────────────────────────────────── -->
  <button class="um-trigger" type="button" (click)="toggleMenu($event)" title="Account menu">
    <span class="um-avatar" [style.background]="profile().avatarColor">
      {{ initials() }}
    </span>
    <div class="um-trigger-info">
      <span class="um-trigger-name">{{ fullName() }}</span>
      <span class="um-trigger-role">{{ profile().roleLabel }}</span>
    </div>
    <svg class="um-chevron" [class.rotated]="menuOpen()" viewBox="0 0 16 16" fill="none">
      <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- ── Dropdown Panel ──────────────────────────────────────────── -->
  @if (menuOpen()) {
    <div class="um-panel" (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="um-header">
        <div class="um-header-avatar" [style.background]="profile().avatarColor">
          {{ initials() }}
        </div>
        <div class="um-header-info">
          <span class="um-header-name">{{ fullName() }}</span>
          <span class="um-header-email">{{ profile().email }}</span>
          <span class="um-header-role" [style.color]="'#00A89D'">{{ profile().roleLabel }}</span>
          <span class="um-header-org">{{ profile().organization }}</span>
        </div>
      </div>

      <div class="um-divider"></div>

      <!-- Profile & Settings -->
      <div class="um-section">
        <button class="um-item" type="button" (click)="navigate('/profile')">
          <span class="um-item-icon">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <div class="um-item-body">
            <span class="um-item-label">My Profile</span>
            <span class="um-item-sub">View and edit your profile</span>
          </div>
          <svg class="um-item-arrow" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>

        <button class="um-item" type="button" (click)="navigate('/account-settings')">
          <span class="um-item-icon">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 3v1.5M10 15.5V17M3 10h1.5M15.5 10H17M4.93 4.93l1.06 1.06M14.01 14.01l1.06 1.06M4.93 15.07l1.06-1.06M14.01 5.99l1.06-1.06" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <div class="um-item-body">
            <span class="um-item-label">Account Settings</span>
            <span class="um-item-sub">Manage your account</span>
          </div>
          <svg class="um-item-arrow" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="um-divider"></div>

      <!-- Notifications -->
      <div class="um-section">
        <button class="um-item" type="button" (click)="navigate('/preferences')">
          <span class="um-item-icon">
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 3a5 5 0 0 1 5 5v2l1.5 2.5H3.5L5 10V8a5 5 0 0 1 5-5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 16.5a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <div class="um-item-body">
            <span class="um-item-label">Notifications</span>
            <span class="um-item-sub">
              {{ profile().notificationsEnabled ? 'On' : 'Paused' }}
            </span>
          </div>
          <svg class="um-item-arrow" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="um-divider"></div>

      <!-- Appearance -->
      <div class="um-section um-section--appearance">
        <div class="um-appear-label">
          <span class="um-item-icon">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span>Appearance</span>
        </div>
        <div class="um-theme-row">
          <button class="um-theme-btn" [class.active]="theme() === 'light'" (click)="setTheme('light')" type="button">
            <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            Light
          </button>
          <button class="um-theme-btn" [class.active]="theme() === 'dark'" (click)="setTheme('dark')" type="button">
            <svg viewBox="0 0 16 16" fill="none"><path d="M6 2.5A6 6 0 1 0 13.5 10 4.5 4.5 0 0 1 6 2.5Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            Dark
          </button>
          <button class="um-theme-btn" [class.active]="theme() === 'system'" (click)="setTheme('system')" type="button">
            <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M5 14h6M8 11v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            System
          </button>
        </div>
      </div>

      <div class="um-divider"></div>

      <!-- Security & Help -->
      <div class="um-section">
        <button class="um-item" type="button" (click)="navigate('/security')">
          <span class="um-item-icon">
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 2L4 5v5c0 3.866 2.686 7.088 6 8 3.314-.912 6-4.134 6-8V5L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </span>
          <div class="um-item-body">
            <span class="um-item-label">Security</span>
            <span class="um-item-sub">Password, 2FA &amp; sessions</span>
          </div>
          <svg class="um-item-arrow" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>

        <button class="um-item" type="button" (click)="navigate('/help')">
          <span class="um-item-icon">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 14v-1M10 7a2 2 0 0 1 1.5 3.33C10.83 11 10 11.5 10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <div class="um-item-body">
            <span class="um-item-label">Help &amp; Support</span>
            <span class="um-item-sub">Docs, shortcuts, release notes</span>
          </div>
          <svg class="um-item-arrow" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="um-divider"></div>

      <!-- Sign Out -->
      <div class="um-section um-section--logout">
        @if (!showLogout()) {
          <button class="um-item um-item--logout" type="button" (click)="confirmLogout()">
            <span class="um-item-icon">
              <svg viewBox="0 0 20 20" fill="none"><path d="M13 7l3 3-3 3M8 10h8M10 3H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <div class="um-item-body">
              <span class="um-item-label">Sign out</span>
            </div>
          </button>
        } @else {
          <div class="um-logout-confirm">
            <p class="um-logout-q">Sign out of FHIRBridge?</p>
            <div class="um-logout-btns">
              <button type="button" class="um-logout-cancel" (click)="cancelLogout()">Cancel</button>
              <button type="button" class="um-logout-ok"     (click)="logout()">Sign out</button>
            </div>
          </div>
        }
      </div>

    </div>
  }

</div>
