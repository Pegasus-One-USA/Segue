<div class="um-wrap" [class.open]="menuOpen()">

  <!-- ── Trigger ─────────────────────────────────────────────────── -->
  <button class="um-trigger" type="button" (click)="toggleMenu($event)" title="Account menu">
    <span class="um-avatar" [style.background]="profile().avatarColor">
      {{ initials() }}
    </span>
    <div class="um-trigger-info">
      <span class="um-trigger-name">{{ fullName() }}</span>
      <span class="um-trigger-role">{{ profile().roleLabel }}</span>
    </div>
    <svg class="um-chevron" [class.rotated]="menuOpen()" viewBox="0 0 16 16" fill="none">
      <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- ── Backdrop ──────────────────────────────────────────────── -->
  @if (menuOpen()) {
    <div class="um-backdrop" (click)="closeMenu()"></div>
  }

  <!-- ── Dropdown Panel ──────────────────────────────────────────── -->
  @if (menuOpen()) {
    <div class="um-panel" (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="um-header">
        <div class="um-header-avatar" [style.background]="profile().avatarColor">
          {{ initials() }}
        </div>
        <div class="um-header-info">
          <span class="um-header-name">{{ fullName() }}</span>
          <span class="um-header-email">{{ profile().email }}</span>
          <span class="um-header-role" [style.color]="'#00A89D'">{{ profile().roleLabel }}</span>
          <span class="um-header-org">{{ profile().organization }}</span>
        </div>
      </div>

      <div class="um-divider"></div>

      <!-- My Profile -->
      <div class="um-section">
        <button class="um-item" type="button" (click)="navigate('/profile')">
          <span class="um-item-icon">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <div class="um-item-body">
            <span class="um-item-label">My Profile</span>
            <span class="um-item-sub">View and edit your profile</span>
          </div>
          <svg class="um-item-arrow" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="um-divider"></div>

      <!-- Security -->
      <div class="um-section">
        <button class="um-item" type="button" (click)="navigate('/security')">
          <span class="um-item-icon">
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 2L4 5v5c0 3.866 2.686 7.088 6 8 3.314-.912 6-4.134 6-8V5L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </span>
          <div class="um-item-body">
            <span class="um-item-label">Security</span>
            <span class="um-item-sub">Password, 2FA &amp; sessions</span>
          </div>
          <svg class="um-item-arrow" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="um-divider"></div>

      <!-- Sign Out -->
      <div class="um-section um-section--logout">
        @if (!showLogout()) {
          <button class="um-item um-item--logout" type="button" (click)="confirmLogout()">
            <span class="um-item-icon">
              <svg viewBox="0 0 20 20" fill="none"><path d="M13 7l3 3-3 3M8 10h8M10 3H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <div class="um-item-body">
              <span class="um-item-label">Sign out</span>
            </div>
          </button>
        } @else {
          <div class="um-logout-confirm">
            <p class="um-logout-q">Sign out of FHIRBridge?</p>
            <div class="um-logout-btns">
              <button type="button" class="um-logout-cancel" (click)="cancelLogout()">Cancel</button>
              <button type="button" class="um-logout-ok"     (click)="logout()">Sign out</button>
            </div>
          </div>
        }
      </div>

    </div>
  }

</div>
