<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">
    <div class="dialog-header__icon">
      <mat-icon>dns</mat-icon>
    </div>
    <div class="dialog-header__text">
      <h2>{{ isEdit ? 'Edit EHR Endpoint' : 'Add EHR Endpoint' }}</h2>
      <p>{{ isEdit ? 'Update endpoint details' : 'Add a known client-organization FHIR endpoint' }}</p>
    </div>
  </div>

  <!-- Form -->
  <mat-dialog-content>

    @if (errorMessage()) {
      <div class="notice error-notice">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" novalidate class="dialog-form">

      <div class="form-row">
        <div class="form-field" [class.form-field--error]="hasError('vendor', 'required')">
          <label for="ehr-vendor">Vendor <span class="req">*</span></label>
          <select id="ehr-vendor" formControlName="vendor">
            @for (option of vendorOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>

        <div class="form-field" [class.form-field--error]="hasError('endpointType', 'required')">
          <label for="ehr-endpointType">Endpoint Type <span class="req">*</span></label>
          <select id="ehr-endpointType" formControlName="endpointType">
            @for (option of endpointTypeOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field" [class.form-field--error]="hasError('vendorEndpointId', 'required') || hasError('vendorEndpointId', 'maxlength')">
          <label for="ehr-vendorEndpointId">Vendor Endpoint Id <span class="req">*</span></label>
          <input
            id="ehr-vendorEndpointId"
            formControlName="vendorEndpointId"
            placeholder="e.g. the vendor's org id for this endpoint"
            autocomplete="off"
          />
        </div>

        <div class="form-field" [class.form-field--error]="hasError('name', 'required') || hasError('name', 'maxlength')">
          <label for="ehr-name">Name <span class="req">*</span></label>
          <input
            id="ehr-name"
            formControlName="name"
            placeholder="e.g. Acme Health System"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="form-field form-field--full" [class.form-field--error]="hasError('fhirBaseUrl', 'required') || hasError('fhirBaseUrl', 'maxlength')">
        <label for="ehr-fhirBaseUrl">FHIR Base URL <span class="req">*</span></label>
        <input
          id="ehr-fhirBaseUrl"
          formControlName="fhirBaseUrl"
          placeholder="https://fhir.example.org/api/FHIR/R4/"
          autocomplete="off"
        />
      </div>

      <div class="form-row">
        <div class="form-field" [class.form-field--error]="hasError('formatType', 'required')">
          <label for="ehr-formatType">Format Type <span class="req">*</span></label>
          <input
            id="ehr-formatType"
            formControlName="formatType"
            placeholder="e.g. R4"
            autocomplete="off"
          />
        </div>

        <div class="form-field" [class.form-field--error]="hasError('status', 'required')">
          <label for="ehr-status">Status <span class="req">*</span></label>
          <input
            id="ehr-status"
            formControlName="status"
            placeholder="e.g. active"
            autocomplete="off"
          />
        </div>
      </div>

    </form>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions>
    <div class="dialog-actions">
      <button
        mat-flat-button
        class="btn-save"
        [disabled]="saving()"
        (click)="save()"
      >
        @if (saving()) {
          <mat-spinner diameter="16"></mat-spinner>
        }
        {{ isEdit ? 'Update' : 'Save' }}
      </button>
    </div>
  </mat-dialog-actions>

</div>
