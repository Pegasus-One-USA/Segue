<!-- ── Pipeline sub-header ─────────────────────────────────────────────────── -->
<header class="builder-subheader">
  <div class="scenario-wrap">
    <svg class="scenario-ico" width="14" height="14" viewBox="0 0 16 16" fill="none">
      <rect x="1" y="1" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.4"/>
      <path d="M5 8h6M8 5v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <input
      class="scenario-name-input"
      [ngModel]="scenarioName()"
      (ngModelChange)="scenarioName.set($event)"
      aria-label="Scenario name"
      spellcheck="false"
    />
  </div>
  <div class="builder-actions">
    <button class="builder-btn" type="button" (click)="onPreview()">Preview payload</button>
    <button class="builder-btn" type="button" (click)="onReset()">Reset</button>
  </div>
</header>

<!-- ── Canvas ──────────────────────────────────────────────────────────────── -->
<div class="builder-canvas-area">
  <app-canvas
    (openWizard)="onOpenWizard($event ?? undefined)"
    (openTransformPicker)="onOpenTransformPicker($event)"
    (openSourcePicker)="onOpenSourcePicker()"
  />
</div>

<!-- ── Overlays / Dialogs ──────────────────────────────────────────────────── -->
<app-epic-source-wizard />

<app-node-library-dialog
  [open]="libraryOpen()"
  [mode]="libraryMode()"
  [originNodeId]="libraryOriginId()"
  (closed)="libraryOpen.set(false)"
  (sourceSelected)="onSourceSelected($event)"
  (transformSelected)="onTransformSelected($event)"
  (mergeSelected)="onMergeSelected($event)"
/>

<app-payload-preview
  [open]="payloadOpen()"
  [scenarioName]="scenarioName()"
  (closed)="payloadOpen.set(false)"
/>

<app-toast />
