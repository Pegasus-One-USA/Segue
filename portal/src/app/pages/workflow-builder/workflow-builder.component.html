<!-- ── Pipeline sub-header ─────────────────────────────────────────────────── -->
<header class="builder-subheader">
  <input
    class="builder-input builder-input--name"
    type="text"
    [value]="workflowName()"
    (input)="onWorkflowNameInput($any($event.target).value)"
    aria-label="Workflow name"
  />
  <button class="builder-btn builder-btn--primary" type="button" [disabled]="workflowBusy()" (click)="onSave()" title="Creates any wizard-drawn source/destination/mapping records, then saves the workflow (updates in place when editing an existing one)">Save</button>
  <input
    class="builder-input"
    type="text"
    [value]="workflowIdInput()"
    (input)="onWorkflowIdInput($any($event.target).value)"
    placeholder="Workflow id"
    aria-label="Workflow id"
  />
  <button class="builder-btn" type="button" [disabled]="workflowBusy() || !workflowIdInput()" (click)="onLoadWorkflow()">Load</button>
  <button class="builder-btn" type="button" [disabled]="workflowBusy() || !currentWorkflowId()" (click)="onRunWorkflow()">Run</button>
  <span class="builder-status">{{ workflowStatus() }}</span>
  <button class="builder-btn builder-btn--danger" type="button" (click)="confirmReset.set(true)">Reset</button>
</header>

<!-- ── Canvas ──────────────────────────────────────────────────────────────── -->
<div class="builder-canvas-area">
  <app-canvas
    (openWizard)="onOpenWizard($event ?? undefined)"
    (openTransformPicker)="onOpenTransformPicker($event)"
    (openSourcePicker)="onOpenSourcePicker()"
  />
</div>

<!-- ── Overlays / Dialogs ──────────────────────────────────────────────────── -->
<app-epic-source-wizard />

<app-node-library-dialog
  [open]="libraryOpen()"
  [mode]="libraryMode()"
  [originNodeId]="libraryOriginId()"
  [editNodeId]="editingNodeId()"
  (closed)="onLibraryClosed()"
  (sourceSelected)="onSourceSelected($event)"
  (transformSelected)="onTransformSelected($event)"
  (mergeSelected)="onMergeSelected($event)"
/>

<app-payload-preview
  [open]="payloadOpen()"
  [scenarioName]="scenarioName()"
  (closed)="payloadOpen.set(false)"
/>

<app-toast />

@if (confirmReset()) {
  <div class="reset-backdrop" tabindex="0"
       (click)="onResetBackdropClick($event)"
       (keydown.escape)="confirmReset.set(false)">
    <div class="reset-dialog">
      <div class="reset-icon">↺</div>
      <h3 class="reset-title">Reset pipeline?</h3>
      <p class="reset-body">All nodes and connections will be removed. This cannot be undone.</p>
      <div class="reset-actions">
        <button type="button" class="btn btn-secondary" (click)="confirmReset.set(false)">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="onReset()">Reset</button>
      </div>
    </div>
  </div>
}
