<!-- ── Pipeline sub-header ─────────────────────────────────────────────────── -->
<header class="builder-subheader">
  <input
    class="builder-input builder-input--name"
    type="text"
    [value]="workflowName()"
    (input)="onWorkflowNameInput($any($event.target).value)"
    placeholder="Untitled workflow"
    aria-label="Workflow name"
  />
  @if (isBackendAudience()) {
    <span class="builder-status" title="Backend Systems run on a schedule">⏱ Trigger</span>
    <select class="builder-input" aria-label="Trigger schedule"
            [value]="triggerType()" (change)="onTriggerTypeInput($any($event.target).value)">
      <option value="Manual">Manual (on demand)</option>
      <option value="Daily">Daily</option>
      <option value="Weekly">Weekly</option>
      <option value="Monthly">Monthly</option>
      <option value="Cron">Cron…</option>
      <option value="Poll">Poll every N min</option>
    </select>
    @if (triggerType() === 'Cron') {
      <input class="builder-input" type="text" aria-label="Cron expression"
             [value]="cronExpression()" (input)="onCronInput($any($event.target).value)" placeholder="0 0 * * *" />
    }
    @if (triggerType() === 'Poll') {
      <input class="builder-input" type="number" min="1" aria-label="Poll interval minutes"
             [value]="pollMinutes()" (input)="onPollMinutesInput($any($event.target).value)" />
    }
  }
  <span class="builder-status">{{ workflowStatus() }}</span>
  <button class="builder-btn builder-btn--danger" type="button" (click)="confirmReset.set(true)">Clear canvas</button>
  <button class="builder-btn builder-btn--primary" type="button" [disabled]="workflowBusy()" (click)="onSave()" title="Save this workflow">Save</button>
</header>

<!-- ── Canvas ──────────────────────────────────────────────────────────────── -->
<div class="builder-canvas-area">
  <app-canvas
    (openWizard)="onOpenWizard($event ?? undefined)"
    (openTransformPicker)="onOpenTransformPicker($event)"
    (openSourcePicker)="onOpenSourcePicker()"
  />
</div>

<!-- ── Overlays / Dialogs ──────────────────────────────────────────────────── -->
<app-epic-source-wizard />

<app-node-library-dialog
  [open]="libraryOpen()"
  [mode]="libraryMode()"
  [originNodeId]="libraryOriginId()"
  [editNodeId]="editingNodeId()"
  (closed)="onLibraryClosed()"
  (sourceSelected)="onSourceSelected($event)"
  (transformSelected)="onTransformSelected($event)"
  (mergeSelected)="onMergeSelected($event)"
/>

<app-payload-preview
  [open]="payloadOpen()"
  [scenarioName]="scenarioName()"
  (closed)="payloadOpen.set(false)"
/>

<app-toast />

@if (confirmReset()) {
  <div class="reset-backdrop" tabindex="0"
       (click)="onResetBackdropClick($event)"
       (keydown.escape)="confirmReset.set(false)">
    <div class="reset-dialog">
      <div class="reset-icon">↺</div>
      <h3 class="reset-title">Clear canvas?</h3>
      <p class="reset-body">All nodes and connections will be removed. This cannot be undone.</p>
      <div class="reset-actions">
        <button type="button" class="btn btn-secondary" (click)="confirmReset.set(false)">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="onReset()">Clear</button>
      </div>
    </div>
  </div>
}
