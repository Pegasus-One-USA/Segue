<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">
    <div class="dialog-header__icon">
      <mat-icon>public</mat-icon>
    </div>
    <div class="dialog-header__text">
      <h2>{{ isEdit ? 'Edit Allowed Origin' : 'Add Allowed Origin' }}</h2>
      <p>{{ isEdit ? 'Update this browser origin\'s URL or label' : 'Widen the API\'s CORS policy to allow this browser origin' }}</p>
    </div>
  </div>

  <!-- Form -->
  <mat-dialog-content>

    @if (errorMessage()) {
      <div class="notice error-notice">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" novalidate class="dialog-form">

      <div class="form-field" [class.form-field--error]="hasError('originUrl', 'required') || hasError('originUrl', 'pattern') || hasError('originUrl', 'maxlength')">
        <label for="aco-originUrl">Origin URL <span class="req">*</span></label>
        <input
          id="aco-originUrl"
          formControlName="originUrl"
          placeholder="https://portal.example.com"
          autocomplete="off"
        />
      </div>

      <div class="form-field" [class.form-field--error]="hasError('label', 'maxlength')">
        <label for="aco-label">Label (optional)</label>
        <input
          id="aco-label"
          formControlName="label"
          placeholder="e.g. Prod VM"
          autocomplete="off"
        />
      </div>

    </form>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions>
    <div class="dialog-actions">
      <button
        mat-flat-button
        class="btn-save"
        [disabled]="saving()"
        (click)="save()"
      >
        @if (saving()) {
          <mat-spinner diameter="16"></mat-spinner>
        }
        {{ isEdit ? 'Update' : 'Save' }}
      </button>
    </div>
  </mat-dialog-actions>

</div>
