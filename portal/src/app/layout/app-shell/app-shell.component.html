<div class="shell">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <app-sidebar [collapsed]="sidebarCollapsed()" />

  <!-- ── Main area ────────────────────────────────────────────────────────── -->
  <div class="shell-main">

    <!-- Topbar -->
    <header class="shell-topbar">

      <button
        class="shell-hamburger"
        type="button"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar"
      >
        <span class="h-line"></span>
        <span class="h-line"></span>
        <span class="h-line"></span>
      </button>

      <span class="shell-page-title">{{ pageTitle() }}</span>

      <div class="shell-actions">
        <!-- Notification bell -->
        <button class="shell-notif" type="button" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M10 3a5 5 0 0 1 5 5v2l1.5 2.5H3.5L5 10V8a5 5 0 0 1 5-5Z"
                  stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M8.5 16.5a1.5 1.5 0 0 0 3 0"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="shell-notif-badge">3</span>
        </button>

        <!-- User menu -->
        <app-user-menu />
      </div>
    </header>

    <!-- Page content (router outlet) -->
    <main class="shell-content">
      <router-outlet />
    </main>

  </div>
</div>
